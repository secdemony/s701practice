<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SY0-701 Acronym Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F6F8;
    --bg-glow:#EFEFFB;
    --surface:#FFFFFF;
    --surface-sunken:#FBFBFC;
    --border:#E7E7EC;
    --border-soft:#EFEFF2;
    --ink:#17171C;
    --ink-soft:#68687A;
    --ink-faint:#9C9CAC;

    --accent:#6D5DF6;
    --accent-ink:#5847E8;
    --accent-tint:#EFECFF;
    --accent-tint-border:#DCD6FE;

    --know:#0F9D6E;
    --know-tint:#E5F7EF;
    --know-tint-border:#C9EEDD;

    --again:#E0525F;
    --again-tint:#FDECEE;
    --again-tint-border:#F8D2D6;

    --shadow-sm:0 1px 2px rgba(23,23,28,.04);
    --shadow-md:0 4px 10px -4px rgba(23,23,28,.08), 0 1px 2px rgba(23,23,28,.04);
    --shadow-lg:0 24px 48px -20px rgba(23,23,28,.22), 0 8px 20px -12px rgba(23,23,28,.10);
    --shadow-btn:0 1px 2px rgba(23,23,28,.05);

    --r-lg:20px;
    --r-md:12px;
    --r-sm:9px;
    --r-pill:999px;

    --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,monospace;

    --card-w:min(600px, 94vw);
    --ease:cubic-bezier(.22,.9,.3,1);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(620px 420px at 50% -8%, var(--bg-glow), transparent 60%),
      var(--bg);
    min-height:100vh;
    color:var(--ink);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    display:flex;flex-direction:column;align-items:center;
    padding:40px 18px 56px;
  }

  ::selection{background:var(--accent-tint);color:var(--accent-ink)}

  /* ---------- focus ---------- */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  /* ---------- header ---------- */
  header{
    width:var(--card-w);display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:28px;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand-mark{
    width:30px;height:30px;border-radius:9px;
    background:linear-gradient(155deg,var(--accent) 0%, #8B7CFF 100%);
    box-shadow:0 3px 8px -2px rgba(109,93,246,.55);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:var(--font-mono);font-weight:600;font-size:13px;
    flex:0 0 auto;
  }
  h1{
    font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.1;
  }
  h1 small{
    display:block;font-size:12px;font-weight:500;color:var(--ink-faint);
    letter-spacing:.01em;margin-top:2px;
  }
  .count{
    font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--border);
    padding:6px 11px;border-radius:var(--r-pill);white-space:nowrap;
    box-shadow:var(--shadow-sm);
  }

  /* ---------- toolbar ---------- */
  .bar{
    width:var(--card-w);display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    margin-bottom:14px;
  }
  button{font-family:var(--font-ui)}
  .chip{
    appearance:none;
    font-size:13px;font-weight:600;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);
    padding:8px 14px;cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:background .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease),transform .12s var(--ease);
    display:inline-flex;align-items:center;gap:6px;
    letter-spacing:-.005em;
  }
  .chip:hover{border-color:#D8D8E2;color:var(--ink)}
  .chip:active{transform:scale(.97)}
  .chip[aria-pressed="true"]{
    background:var(--accent-tint);border-color:var(--accent-tint-border);color:var(--accent-ink);
  }
  .chip svg{width:14px;height:14px;flex:0 0 auto}

  /* ---------- letters ---------- */
  .letters{
    width:var(--card-w);display:flex;gap:6px;overflow-x:auto;
    padding:4px 2px 14px;margin-bottom:8px;
    scrollbar-width:thin;
  }
  .letters::-webkit-scrollbar{height:5px}
  .letters::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
  .letters button{
    appearance:none;font-family:var(--font-mono);font-size:12px;font-weight:600;
    color:var(--ink-faint);background:transparent;border:1px solid transparent;
    min-width:30px;height:30px;border-radius:var(--r-sm);flex:0 0 auto;cursor:pointer;
    transition:all .14s var(--ease);
  }
  .letters button:hover{color:var(--ink);background:var(--surface-sunken)}
  .letters button[aria-pressed="true"]{
    color:#fff;background:var(--ink);border-color:var(--ink);
  }

  /* ---------- stage / card ---------- */
  .stage{width:var(--card-w);perspective:1800px;margin-bottom:22px;}
  .card{
    position:relative;width:100%;min-height:320px;
    transform-style:preserve-3d;-webkit-transform-style:preserve-3d;
    transform:translateZ(0) rotateY(0deg);-webkit-transform:translateZ(0) rotateY(0deg);
    transition:transform .55s var(--ease), box-shadow .3s var(--ease);
    cursor:pointer;border:0;background:none;padding:0;text-align:left;
    border-radius:var(--r-lg);
    will-change:transform;
  }
  .card:active{transform:translateZ(0) rotateY(0deg) scale(.995)}
  .card.flipped{transform:translateZ(0) rotateY(180deg)}
  .card.flipped:active{transform:translateZ(0) rotateY(180deg) scale(.995)}

  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    transform:translateZ(0);-webkit-transform:translateZ(0);
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--r-lg);
    box-shadow:var(--shadow-lg);
    padding:38px 38px 30px;
    display:flex;flex-direction:column;
  }
  /* Belt-and-braces on top of backface-visibility: some Chrome/Safari builds
     glitch and leave the away-facing side blank-but-hovered instead of
     properly hiding it during/after a 3D flip. Explicit visibility
     toggling keyed off .flipped guarantees the right face is readable. */
  .face.front{visibility:visible}
  .face.back{transform:rotateY(180deg) translateZ(0);-webkit-transform:rotateY(180deg) translateZ(0);visibility:hidden}
  .card.flipped .face.front{visibility:hidden}
  .card.flipped .face.back{visibility:visible}

  .face-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:22px}
  .eyebrow{
    font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ink-faint);
  }
  .letter-badge{
    font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--ink-soft);
    background:var(--surface-sunken);border:1px solid var(--border-soft);
    width:26px;height:26px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }

  .card-body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}

  .term{
    font-family:var(--font-ui);font-weight:800;letter-spacing:-.02em;
    font-size:clamp(30px,7vw,44px);line-height:1.08;color:var(--ink);
    word-break:break-word;
  }
  .meaning{
    font-size:clamp(16px,2.4vw,18px);line-height:1.6;color:var(--ink);
    font-weight:450;
  }
  .meaning .lead{
    font-family:var(--font-mono);font-weight:700;letter-spacing:-.01em;
    display:block;margin-bottom:10px;font-size:15px;color:var(--accent-ink);
  }

  .face-bottom{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:24px;padding-top:16px;border-top:1px solid var(--border-soft);
  }
  .hint{
    font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--ink-faint);
    display:flex;align-items:center;gap:6px;
  }
  .hint svg{width:13px;height:13px;opacity:.7}
  .marked{
    font-size:11px;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:var(--r-pill);
  }
  .marked:empty{display:none}
  .marked.k{color:var(--know);background:var(--know-tint)}
  .marked.a{color:var(--again);background:var(--again-tint)}

  /* ---------- grading row ---------- */
  .grade{width:var(--card-w);display:flex;gap:10px;margin-bottom:26px}
  .gbtn{
    flex:1;appearance:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:14.5px;font-weight:700;letter-spacing:-.005em;
    padding:14px 10px;border-radius:var(--r-md);border:1px solid transparent;
    transition:transform .12s var(--ease), background .16s var(--ease), box-shadow .16s var(--ease);
    box-shadow:var(--shadow-btn);
  }
  .gbtn:active{transform:scale(.98)}
  .gbtn svg{width:16px;height:16px}
  #again{background:var(--again-tint);color:var(--again);border-color:var(--again-tint-border)}
  #again:hover{background:#FBDFE2}
  #know{background:var(--know-tint);color:var(--know);border-color:var(--know-tint-border)}
  #know:hover{background:#D6F1E4}

  /* ---------- prev/next row ---------- */
  .navrow{width:var(--card-w);display:flex;align-items:center;gap:10px;margin-top:-14px;margin-bottom:26px}
  .navbtn{
    appearance:none;cursor:pointer;flex:1;
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:13.5px;font-weight:600;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
    padding:11px 10px;box-shadow:var(--shadow-sm);
    transition:background .16s var(--ease),color .16s var(--ease),border-color .16s var(--ease),transform .12s var(--ease);
  }
  .navbtn:hover{background:var(--surface-sunken);color:var(--ink);border-color:#D8D8E2}
  .navbtn:active{transform:scale(.97)}
  .navbtn svg{width:15px;height:15px}
  .navbtn:disabled{opacity:.4;cursor:default;transform:none}

  /* ---------- progress ---------- */
  .progress{width:var(--card-w)}
  .progress-track{
    position:relative;width:100%;height:6px;border-radius:99px;
    background:var(--border-soft);overflow:hidden;margin-bottom:14px;
  }
  .progress-fill{
    position:absolute;inset:0 auto 0 0;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),#8B7CFF);
    transition:width .35s var(--ease);
  }
  .legend{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  }
  .stat{
    display:inline-flex;align-items:center;gap:7px;
    font-size:12.5px;font-weight:600;color:var(--ink-soft);
  }
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .dot.know{background:var(--know)}
  .dot.again{background:var(--again)}
  .dot.unseen{background:var(--ink-faint);opacity:.5}
  .stat b{color:var(--ink);font-weight:700}

  .keys{
    margin-top:22px;text-align:center;font-size:12px;color:var(--ink-faint);
    letter-spacing:.01em;
  }
  kbd{
    font-family:var(--font-mono);font-size:10.5px;font-weight:600;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--border);border-bottom-width:2px;
    border-radius:5px;padding:2px 5px;
  }

  @media (prefers-reduced-motion: reduce){
    .card, .chip, .gbtn, .navbtn, .letters button, .progress-fill{transition:none !important}
  }

  @media (max-width:480px){
    body{padding:26px 14px 40px}
    header{margin-bottom:20px}
    .face{padding:28px 24px 24px}
    .grade{gap:8px}
    .navrow{margin-top:-10px}
    .keys{display:none}
  }
</style>

<header>
  <div class="brand">
    <div class="brand-mark">S+</div>
    <h1>SY0-701 Acronyms<small>Flashcard deck</small></h1>
  </div>
  <div class="count" id="count">—</div>
</header>

<div class="bar">
  <button id="mode" class="chip" aria-pressed="false">Show meaning first</button>
  <button id="shuffle" class="chip">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h2.8a3 3 0 0 1 2.4 1.2L11 10a3 3 0 0 0 2.4 1.2H14M2 12h2.8a3 3 0 0 0 2.4-1.2L11 6a3 3 0 0 1 2.4-1.2H14"/><path d="M12 2l2 2-2 2M12 10l2 2-2 2"/></svg>
    Shuffle
  </button>
  <button id="onlyagain" class="chip" aria-pressed="false">Review flagged</button>
  <button id="reset" class="chip">Reset progress</button>
</div>

<div class="letters" id="letters"></div>

<div class="stage">
  <button class="card" id="card" aria-live="polite">
    <div class="face front">
      <div class="face-top">
        <div class="eyebrow" id="eyeF">Acronym</div>
        <div class="letter-badge" id="tabF">A</div>
      </div>
      <div class="card-body" id="frontBody"></div>
      <div class="face-bottom">
        <div class="hint">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a5 5 0 0 1 8.5-3.5M13 8a5 5 0 0 1-8.5 3.5"/><path d="M11 2v3h-3M5 14v-3h3"/></svg>
          Tap to flip
        </div>
        <div class="marked" id="markF"></div>
      </div>
    </div>
    <div class="face back">
      <div class="face-top">
        <div class="eyebrow" id="eyeB">Meaning</div>
        <div class="letter-badge" id="tabB">A</div>
      </div>
      <div class="card-body" id="backBody"></div>
      <div class="face-bottom">
        <div class="hint">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a5 5 0 0 1 8.5-3.5M13 8a5 5 0 0 1-8.5 3.5"/><path d="M11 2v3h-3M5 14v-3h3"/></svg>
          Tap to flip back
        </div>
        <div class="marked" id="markB"></div>
      </div>
    </div>
  </button>
</div>

<div class="grade">
  <button id="again" class="gbtn">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    Study again
  </button>
  <button id="know" class="gbtn">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>
    Know it
  </button>
</div>

<div class="navrow">
  <button id="prev" class="navbtn">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
    Previous
  </button>
  <button id="next" class="navbtn">
    Next
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>
  </button>
</div>

<div class="progress">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="legend">
    <span class="stat"><span class="dot know"></span>Known <b id="nk">0</b></span>
    <span class="stat"><span class="dot again"></span>Flagged <b id="na">0</b></span>
    <span class="stat"><span class="dot unseen"></span>Unseen <b id="nu">0</b></span>
  </div>
  <div class="keys">
    <kbd>Space</kbd> flip &nbsp; <kbd>←</kbd> <kbd>→</kbd> move &nbsp; <kbd>1</kbd> study again &nbsp; <kbd>2</kbd> know it &nbsp; <kbd>S</kbd> shuffle
  </div>
</div>

<script>
const DATA = [
["AAA","Authentication, Authorization, and Accounting — the framework (e.g., via RADIUS/TACACS+) for verifying identity, granting permissions, and logging usage"],
["ACL","Access Control List — rules that permit or deny traffic/access at a network device or file system level"],

["CERT","Computer Emergency Response Team"],

["CIA (triad)","Confidentiality, Integrity, Availability — the three core security objectives"],

["CIS","Center for Internet Security — publishes widely used security configuration benchmarks"],
["CISO","Chief Information Security Officer"],

["COPE","Corporate-Owned, Personally Enabled — company-owned devices employees may also use personally"],

const cards = DATA.map((d, i) => ({ id:i, term:d[0], meaning:d[1], letter:d[0][0].toUpperCase() }));
const status = {};            // id -> "k" | "a"
let deck = cards.map(c => c.id);
let pos = 0;
let flipped = false;
let reversed = false;
let letter = "ALL";
let flaggedOnly = false;

const $ = id => document.getElementById(id);
const cardEl = $("card");

/* letter filter chips */
const lettersPresent = [...new Set(cards.map(c => c.letter))].sort();
const lettersBox = $("letters");
["ALL", ...lettersPresent].forEach(L => {
  const b = document.createElement("button");
  b.textContent = L === "ALL" ? "All" : L;
  b.dataset.letter = L;
  b.setAttribute("aria-pressed", L === "ALL" ? "true" : "false");
  b.addEventListener("click", () => { letter = L; buildDeck(); });
  lettersBox.appendChild(b);
});

function buildDeck(keepShuffle){
  let pool = cards.filter(c => letter === "ALL" || c.letter === letter);
  if (flaggedOnly) pool = pool.filter(c => status[c.id] === "a");
  deck = pool.map(c => c.id);
  if (keepShuffle) shuffleDeck(false);
  pos = 0; flipped = false;
  [...lettersBox.children].forEach(b => b.setAttribute("aria-pressed", b.dataset.letter === letter));
  $("onlyagain").setAttribute("aria-pressed", flaggedOnly);
  render();
}

function shuffleDeck(rerender){
  for (let i = deck.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  pos = 0; flipped = false;
  if (rerender !== false) render();
}

function current(){ return deck.length ? cards[deck[pos]] : null; }

function render(){
  const c = current();
  cardEl.classList.toggle("flipped", flipped);

  if (!c){
    $("frontBody").innerHTML = '<div class="term" style="font-size:24px">Nothing here yet</div>';
    $("backBody").innerHTML = '<div class="meaning">Flag a few cards with “Study again,” then come back.</div>';
    $("count").textContent = "0 cards";
    $("tabF").textContent = $("tabB").textContent = "—";
    $("markF").textContent = $("markB").textContent = "";
    drawTicks();
    return;
  }

  const termHTML = '<div class="term">' + esc(c.term) + "</div>";
  const meanHTML = '<div class="meaning">' + esc(c.meaning) + "</div>";
  const meanWithLead = '<div class="meaning"><span class="lead">' + esc(c.term) + "</span>" + esc(c.meaning) + "</div>";

  if (!reversed){
    $("eyeF").textContent = "Acronym";
    $("frontBody").innerHTML = termHTML;
    $("eyeB").textContent = "Meaning";
    $("backBody").innerHTML = meanHTML;
  } else {
    $("eyeF").textContent = "What is this?";
    $("frontBody").innerHTML = '<div class="meaning">' + esc(stripTerm(c)) + "</div>";
    $("eyeB").textContent = "Acronym";
    $("backBody").innerHTML = meanWithLead;
  }

  $("tabF").textContent = $("tabB").textContent = c.letter;
  const s = status[c.id];
  const label = s === "k" ? "Known" : s === "a" ? "Flagged" : "";
  const cls = s === "k" ? "marked k" : s === "a" ? "marked a" : "marked";
  $("markF").className = $("markB").className = cls;
  $("markF").textContent = $("markB").textContent = label;

  $("count").textContent = (pos + 1) + " / " + deck.length + (letter === "ALL" ? "" : "  ·  " + letter);
  drawTicks();
}

/* in reverse mode, hide the acronym if it appears in its own definition */
function stripTerm(c){
  const parts = c.meaning.split("—");
  return parts.length > 1 ? parts.slice(1).join("—").trim() : c.meaning;
}

function esc(t){
  return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function drawTicks(){
  let k = 0, a = 0;
  deck.forEach(id => {
    if (status[id] === "k") k++;
    if (status[id] === "a") a++;
  });
  $("nk").textContent = k;
  $("na").textContent = a;
  $("nu").textContent = deck.length - k - a;
  const pct = deck.length ? ((pos + 1) / deck.length) * 100 : 0;
  $("progressFill").style.width = pct + "%";
}

function move(step){
  if (!deck.length) return;
  pos = (pos + step + deck.length) % deck.length;
  flipped = false;
  render();
}

function grade(mark){
  const c = current();
  if (!c) return;
  status[c.id] = mark;
  move(1);
}

/* events */
cardEl.addEventListener("click", () => { flipped = !flipped; render(); });
$("next").addEventListener("click", () => move(1));
$("prev").addEventListener("click", () => move(-1));
$("know").addEventListener("click", () => grade("k"));
$("again").addEventListener("click", () => grade("a"));
$("shuffle").addEventListener("click", () => shuffleDeck());
$("mode").addEventListener("click", e => {
  reversed = !reversed;
  e.currentTarget.setAttribute("aria-pressed", reversed);
  e.currentTarget.textContent = reversed ? "Show acronym first" : "Show meaning first";
  flipped = false;
  render();
});
$("onlyagain").addEventListener("click", () => { flaggedOnly = !flaggedOnly; buildDeck(); });
$("reset").addEventListener("click", () => {
  Object.keys(status).forEach(k => delete status[k]);
  flaggedOnly = false;
  buildDeck();
});

document.addEventListener("keydown", e => {
  if (e.target.tagName === "BUTTON" && e.key === " ") return;
  if (e.key === " " || e.key === "Enter"){ e.preventDefault(); flipped = !flipped; render(); }
  else if (e.key === "ArrowRight") move(1);
  else if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "1") grade("a");
  else if (e.key === "2") grade("k");
  else if (e.key.toLowerCase() === "s") shuffleDeck();
});

buildDeck();
</script>
